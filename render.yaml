services:
  - type: web
    name: shelby-ios-store
    runtime: node
    buildCommand: npm ci --omit=dev --no-audit --no-fund && npm run build
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CANONICAL_ORIGIN
        sync: false
      - key: PUBLIC_BACKEND_ORIGIN
        value: https://emirhan-siye.onrender.com
      - key: PUBLIC_API_BASE
        value: https://emirhan-siye.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: PUBLIC_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
        sync: false
      - key: APP_CHECK_MODE
        value: enforce
      - key: RATE_LIMIT_STORE
        value: firestore
      - key: STORE_KEY_ENCRYPTION_SECRET
        sync: false
      - key: STORE_KEY_FINGERPRINT_SECRET
        sync: false
      - key: STORE_KEY_ACTIVE_KEY_ID
        value: vault-2026-v1
      - key: STORE_KEY_DECRYPTION_KEYS_JSON
        sync: false
      - key: FIREBASE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: ADMIN_GATE_FOUR_SALT_HEX
        sync: false
      - key: ADMIN_GATE_FOUR_HASH_HEX
        sync: false
      - key: ADMIN_GATE_FIVE_SALT_HEX
        sync: false
      - key: ADMIN_GATE_FIVE_HASH_HEX
        sync: false
      - key: ADMIN_GATE_SIGNING_SECRET
        sync: false
      - key: ADMIN_TOTP_MODE
        value: required
      - key: ADMIN_TOTP_SECRET_BASE32
        sync: false
      - key: SENSITIVE_ACTION_RECENT_AUTH_SECONDS
        value: "180"
      - key: ADMIN_SECURITY_MIN_SCORE
        value: "90"
      - key: ADMIN_SESSION_TTL_MINUTES
        value: "120"
      - key: SECURITY_CSP_STRICT
        value: "1"
