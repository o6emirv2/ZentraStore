services:
  - type: web
    name: emirhan-siye
    runtime: node
    buildCommand: npm ci --omit=dev --no-fund && npm run build
    startCommand: node server.js
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://zentrastore.com.tr
      - key: CANONICAL_ORIGIN
        value: https://zentrastore.com.tr
      - key: PUBLIC_API_BASE
        value: https://emirhan-siye.onrender.com
      - key: PUBLIC_BACKEND_ORIGIN
        value: https://emirhan-siye.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://www.zentrastore.com.tr
      - key: PUBLIC_FIREBASE_CONFIG
        sync: false
      - key: APP_CHECK_MODE
        value: monitor
      - key: FIREBASE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: ADMIN_GATE_FOUR_SALT_HEX
        sync: false
      - key: ADMIN_GATE_FOUR_HASH_HEX
        sync: false
      - key: ADMIN_GATE_FIVE_SALT_HEX
        sync: false
      - key: ADMIN_GATE_FIVE_HASH_HEX
        sync: false
      - key: ADMIN_GATE_SIGNING_SECRET
        sync: false
      - key: ADMIN_TOTP_MODE
        value: required
      - key: ADMIN_TOTP_SECRET_BASE32
        sync: false
      - key: STORE_KEY_ACTIVE_KEY_ID
        sync: false
      - key: STORE_KEY_ENCRYPTION_SECRET
        sync: false
      - key: STORE_KEY_FINGERPRINT_SECRET
        sync: false
      - key: STORE_KEY_DECRYPTION_KEYS_JSON
        sync: false
      - key: SHOPIER_ENABLED
        sync: false
      - key: SHOPIER_API_BASE_URL
        value: https://api.shopier.com/v1
      - key: SHOPIER_PAT
        sync: false
      - key: SHOPIER_WEBHOOK_TOKEN
        sync: false
      - key: SHOPIER_REFUND_WEBHOOK_TOKEN
        sync: false
      - key: SHOPIER_WEBHOOK_URL
        value: https://emirhan-siye.onrender.com/api/payments/shopier/webhook
      - key: WEQ_PUBLIC_BASE_URL
        value: https://zentrastore.com.tr
      - key: SHOPIER_SUCCESS_URL
        value: https://zentrastore.com.tr/odeme/sonuc
      - key: SHOPIER_CANCEL_URL
        value: https://zentrastore.com.tr/odeme/iptal
      - key: SHOPIER_HTTP_TIMEOUT_MS
        value: "15000"
